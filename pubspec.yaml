name: beytourney_hideout
description: Multiplatform Beyblade tournament app converted from the BJX/HIDEOUT web prototype.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  mobile_scanner: ^7.2.0
  firebase_storage: ^12.4.10
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/beyparts.json
    - assets/beybrew/parts/
